  <h1 style="text-align:center;">Joystick Robot Car</h1>
  <div id="joystickZone"></div>

  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
  <script>
    const joystick = nipplejs.create({
      zone: document.getElementById('joystickZone'),
      mode: 'static',
      position: { left: '50%', top: '50%' },
      color: 'blue'
    });

    let lastSent = 0;

    joystick.on('move', (evt, data) => {
      const now = Date.now();
      if (now - lastSent > 150) { // limit update rate
        if (data && data.angle) {
          const angle = data.angle.degree;
          const force = Math.min(data.force, 1.0).toFixed(2);
          fetch(`/drive?angle=${angle}&force=${force}`);
          lastSent = now;
        }
      }
    });

    joystick.on('end', () => {
      fetch('/drive?angle=0&force=0'); // stop motors
    });
  </script>

// Function to fetch battery data from ESP32
async function BatteryMonitor() {
    try {
        const response = await fetch('/battery'); // Endpoint on ESP32
        const data = await response.json();
        
        // Update HTML elements
        document.getElementById('voltage').innerText = data.voltage.toFixed(2) + ' V';
        document.getElementById('percentage').innerText = data.percent + '%';
        
        // Change color based on charge
        const batteryDisplay = document.getElementById('battery-display');
        batteryDisplay.style.color = data.percent < 20 ? 'red' : 'green';
    } catch (error) {
        console.error('Error fetching battery data:', error);
    }
}

const totalSegments = 12; // quantidade de blocos
const batteryBar = document.getElementById("batteryBar");

// cria os blocos
for (let i = 0; i < totalSegments; i++) {
  const div = document.createElement("div");
  div.classList.add("segment");
  batteryBar.appendChild(div);
}

function updateBattery(percent) {
  const segments = document.querySelectorAll(".segment");
  const activeCount = Math.round((percent / 100) * segments.length);

  segments.forEach((seg, index) => {
    if (index < activeCount) {
      seg.classList.add("active");

      // atraso progressivo (efeito correndo)
      seg.style.animationDelay = (index * 0.1) + "s";

    } else {
      seg.classList.remove("active");
      seg.style.animationDelay = "0s";
    }
  });
}
